header nav a{border:0;background:transparent;padding:9px 12px;font-size:13px;letter-spacing:.06em}
header nav a:hover{color:var(--ac);background:var(--gl)}
header nav button{padding:9px 13px}
main{max-width:1440px;padding:clamp(18px,3vw,42px) clamp(16px,4vw,56px) 76px}
.hero{min-height:clamp(340px,42vw,560px);padding:clamp(26px,6vw,86px);border-radius:22px;margin-bottom:26px;display:flex;flex-direction:column;justify-content:center}
.hero h1{max-width:12em;font-size:clamp(34px,5.2vw,68px);line-height:1.02}
.hero p{max-width:39em}
.hero .row{margin-top:10px}
.mq{margin:0 0 42px}
.sec{margin:48px 0 18px;align-items:center}
.sec h2{font-size:clamp(22px,2.6vw,32px)}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.5vw,22px)}
.pc{padding:10px;border-radius:16px;gap:10px;background:color-mix(in srgb,var(--gl) 85%,var(--bg2));}
.pc .art{aspect-ratio:4/5;border-radius:12px;overflow:hidden}
.pc .art img{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.pc:hover .art img{transform:scale(1.045)}
.pc .pn{font-size:14px;line-height:1.35;min-height:2.6em}
.pc .row button{font-size:10px;white-space:nowrap}
.pc .row button:first-child{background:transparent}
.chips{scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
input[data-c=q]{max-width:360px!important}
.pp{gap:clamp(22px,5vw,64px);align-items:start}
.pp .art.big{aspect-ratio:4/5;max-height:680px}
.pp>div:last-child{position:sticky;top:100px}
.blk{border-radius:20px}
footer{padding:42px clamp(16px,4vw,56px);background:color-mix(in srgb,var(--gl) 55%,var(--bg))}
:root[data-t=light] .pc{background:rgba(255,255,255,.78);border-color:rgba(80,55,15,.12);box-shadow:0 8px 28px rgba(60,42,15,.07)}
:root[data-t=light] .pc .art{background:#eee8dc}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{grid-template-columns:1fr}}
@media(max-width:720px){
 header{position:sticky;top:0;min-height:60px;padding:9px 14px;flex-wrap:wrap;gap:5px 10px}
 header .logo{font-size:19px}
 header nav.st{width:100%;margin:0;justify-content:space-between;gap:3px;overflow-x:auto;flex-wrap:nowrap}
 header nav.st a,header nav.st button{font-size:11px;padding:7px 9px;white-space:nowrap}
 header nav.st #xnav{display:contents}
 main{padding:16px 13px 88px}
 .hero{min-height:370px;padding:28px 22px;border-radius:17px}
 .hero h1{font-size:clamp(32px,9vw,46px)}
 .hero .lead{font-size:16px}
 .mq{margin-bottom:30px}
 .sec{margin:34px 0 13px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .pc{padding:7px;gap:7px;border-radius:13px}
 .pc .art{aspect-ratio:3/4;border-radius:10px}
 .pc .pn{font-size:12px;min-height:2.5em}
 .pc .row{gap:5px}

 .pc .row button .ic{display:none}

 .pp>div:last-child{position:static}
 .pp .art.big{max-height:none;aspect-ratio:4/4.5}
 .blk{margin:24px 0}
 footer{padding:28px 16px 90px;gap:18px}

}
@media(max-width:380px){
 header nav.st a,header nav.st button{padding:6px 7px;font-size:10px}
 .pc .row button{font-size:8px}
}
@media(prefers-reduced-motion:reduce){.pc .art img{transition:none}}

/* Mobile header logo sizing */

  header .logo{font-size:15px;letter-spacing:.14em;line-height:1;}

/* IJAZ — Handifyy-inspired editorial storefront experience; original IJAZ palette retained */
:root{--ij-shadow:0 22px 70px rgba(0,0,0,.24)}
body:not(.adm) main{overflow:hidden}
body:not(.adm) .hero{
 isolation:isolate;min-height:clamp(430px,57vw,650px);
 border:1px solid color-mix(in srgb,var(--ac) 30%,var(--ln));
 box-shadow:var(--ij-shadow),inset 0 1px 0 rgba(255,255,255,.12);
 background-image:radial-gradient(ellipse at 78% 35%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 36%),linear-gradient(115deg,color-mix(in srgb,var(--bg) 8%,transparent),color-mix(in srgb,var(--bg) 58%,transparent) 72%);
 animation:ijHeroIn .9s cubic-bezier(.2,.7,.2,1) both;
}
body:not(.adm) .hero:before{content:"";position:absolute;z-index:-1;width:min(54vw,590px);aspect-ratio:1;right:-7%;top:50%;transform:translateY(-50%);border:1px solid color-mix(in srgb,var(--ac) 38%,transparent);border-radius:50%;box-shadow:0 0 0 28px color-mix(in srgb,var(--ac) 4%,transparent),0 0 0 66px color-mix(in srgb,var(--ac) 3%,transparent),inset 0 0 80px color-mix(in srgb,var(--ac) 9%,transparent);animation:ijOrbit 28s linear infinite}
body:not(.adm) .hero .ring{right:10%;width:min(32vw,360px);opacity:.58}
body:not(.adm) .hero .eyebrow{animation:ijRise .7s .1s both}
body:not(.adm) .hero h1{max-width:11em;text-wrap:balance;animation:ijRise .8s .2s both;text-shadow:0 8px 40px rgba(0,0,0,.12)}
body:not(.adm) .hero .bnl{animation:ijRise .8s .32s both}
body:not(.adm) .hero .lead{max-width:32em;animation:ijRise .8s .42s both}
body:not(.adm) .hero .row{animation:ijRise .8s .52s both}
body:not(.adm) .hero .btn.pri{position:relative;overflow:hidden;padding:13px 22px;box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 24%,transparent)}
body:not(.adm) .hero .btn.pri:after{content:"";position:absolute;inset:-60% auto -60% -45%;width:28%;transform:rotate(22deg);background:rgba(255,255,255,.38);filter:blur(8px);animation:ijShine 4.8s 1.2s ease-in-out infinite}
body:not(.adm) .mq{margin:0 0 52px;border-color:color-mix(in srgb,var(--ac) 22%,var(--ln));background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 5%,transparent),transparent)}
body:not(.adm) .mq div{padding:15px 0;font-size:10px;letter-spacing:.28em}
body:not(.adm) .sec{position:relative;margin:58px 0 20px;padding-bottom:12px}
body:not(.adm) .sec:after{content:"";position:absolute;left:0;bottom:0;width:54px;height:1px;background:var(--ac);box-shadow:0 0 14px var(--ac)}
body:not(.adm) .sec h2{letter-spacing:.025em}
body:not(.adm) main>.row:not(.sec){gap:10px}
body:not(.adm) main>.row:not(.sec) .btn{border-radius:999px;padding:10px 17px;border-color:color-mix(in srgb,var(--ac) 25%,var(--ln));background:linear-gradient(135deg,var(--gl),color-mix(in srgb,var(--ac) 6%,transparent));transition:transform .25s,border-color .25s,background .25s}
body:not(.adm) main>.row:not(.sec) .btn:hover{transform:translateY(-3px);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,var(--gl))}
body:not(.adm) .pc{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--ln) 85%,transparent);box-shadow:0 8px 28px rgba(0,0,0,.09);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s}
body:not(.adm) .pc:hover{transform:translateY(-7px);border-color:color-mix(in srgb,var(--ac) 52%,var(--ln));box-shadow:0 18px 42px rgba(0,0,0,.2)}
body:not(.adm) .pc .art{background-color:color-mix(in srgb,var(--bg2) 80%,var(--ac) 4%)}
body:not(.adm) .pc .heart{width:36px;height:36px;border-radius:50%;background:rgba(20,16,10,.66);color:#fff;border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(12px);font-size:18px}
body:not(.adm) .pc .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
body:not(.adm) .pc .pn{font-family:var(--fb);font-weight:600;letter-spacing:0}
body:not(.adm) .pc .row button{min-height:38px}
body:not(.adm) .blk{position:relative;min-height:300px;border-color:color-mix(in srgb,var(--ac) 18%,var(--ln));box-shadow:var(--ij-shadow);border-radius:22px}
body:not(.adm) .blk>div:first-child{padding:clamp(24px,5vw,62px)!important}
body:not(.adm) .blk h2{font-size:clamp(26px,3.4vw,42px);line-height:1.12}
body:not(.adm) .blkimg{min-height:300px;position:relative}
body:not(.adm) .blkimg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 12%,transparent),transparent)}
body:not(.adm) .rl{gap:14px}
body:not(.adm) .rc{border-color:color-mix(in srgb,var(--ac) 18%,var(--ln));background:linear-gradient(145deg,var(--gl),color-mix(in srgb,var(--ac) 4%,var(--bg2)));transition:transform .3s,border-color .3s}
body:not(.adm) .rc:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--ac) 55%,var(--ln))}
body:not(.adm) footer{margin-top:56px;border-top-color:color-mix(in srgb,var(--ac) 24%,var(--ln))}
@keyframes ijHeroIn{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ijRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes ijOrbit{to{transform:translateY(-50%) rotate(360deg)}}
@keyframes ijShine{0%,65%,100%{left:-45%}82%{left:125%}}
@media(max-width:720px){
 body:not(.adm) .hero{min-height:430px;padding:30px 22px}
 body:not(.adm) .hero:before{width:82vw;right:-37%;top:54%;opacity:.55}
 body:not(.adm) .hero .ring{width:54vw;right:-8%;top:58%}
 body:not(.adm) .hero h1{max-width:9em;font-size:clamp(32px,9vw,46px)}
 body:not(.adm) .hero .lead{max-width:24em;font-size:15px}
 body:not(.adm) .mq{margin-bottom:34px}
 body:not(.adm) .sec{margin:38px 0 15px}
 body:not(.adm) .blk{min-height:0}
 body:not(.adm) .blkimg{min-height:220px;order:-1}
 body:not(.adm) .pc:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
 body:not(.adm) .hero,body:not(.adm) .hero:before,body:not(.adm) .hero .eyebrow,body:not(.adm) .hero h1,body:not(.adm) .hero .bnl,body:not(.adm) .hero .lead,body:not(.adm) .hero .row,body:not(.adm) .hero .btn.pri:after{animation:none!important}
}


/* IJAZ glass analytics dashboard refresh */
body.adm{background:radial-gradient(ellipse at 78% 0%,rgba(224,162,59,.13),transparent 38%),radial-gradient(ellipse at 4% 35%,rgba(255,255,255,.035),transparent 32%),var(--bg)}
body.adm main{max-width:1720px;padding:clamp(16px,2.5vw,34px) clamp(13px,2.6vw,38px) 70px}
body.adm .shell{grid-template-columns:248px minmax(0,1fr);gap:clamp(14px,2vw,28px)}
body.adm .sidebar{top:18px;min-height:calc(100vh - 36px);padding:14px;background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px rgba(255,255,255,.12),0 18px 50px rgba(0,0,0,.18)}
body.adm .sidebar button{border-radius:11px;min-height:42px;transition:background .2s,transform .2s,color .2s}
body.adm .sidebar button:hover{background:rgba(255,255,255,.065);transform:translateX(2px)}
body.adm .sidebar button.on{background:linear-gradient(100deg,rgba(224,162,59,.22),rgba(224,162,59,.07));box-shadow:inset 3px 0 var(--ac);color:var(--fg)}
body.adm .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 18px!important}
body.adm .stat{padding:18px;min-width:0;position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:inset 0 1px rgba(255,255,255,.1),0 10px 28px rgba(0,0,0,.12);transition:transform .22s,border-color .22s}
body.adm .stat:hover{transform:translateY(-3px);border-color:rgba(224,162,59,.48)}
body.adm .stat b{font:600 clamp(20px,2.3vw,29px)/1.2 var(--fb);letter-spacing:-.04em;margin-top:10px;overflow-wrap:anywhere}
body.adm .stat>span{font-size:12px;letter-spacing:.02em}
body.adm .attn{gap:10px;margin-bottom:20px}
body.adm .attn-c{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px rgba(255,255,255,.09),0 8px 24px rgba(0,0,0,.1);transition:transform .2s,border-color .2s}
body.adm .attn-c:hover{transform:translateY(-2px);border-color:var(--ac)}
body.adm .attn-c b{font-size:34px}
body.adm .bars{height:165px;gap:clamp(8px,2vw,20px);padding:12px 6px 8px}
body.adm .bars div{max-width:54px;background:linear-gradient(180deg,#f4c66e,var(--ac) 60%,rgba(224,162,59,.48));box-shadow:0 0 22px rgba(224,162,59,.13);transition:filter .2s}
body.adm .bars div:hover{filter:brightness(1.2)}
body.adm .bars span{font-size:10px;white-space:nowrap}
body.adm section>h3{font-size:18px;margin:24px 0 12px}
body.adm .orow{padding:15px 16px;border:1px solid var(--ln);background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.02));box-shadow:inset 0 1px rgba(255,255,255,.07);transition:transform .2s,border-color .2s}
body.adm .orow:hover{transform:translateY(-2px);border-color:rgba(224,162,59,.45)}
body.adm .dash-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:2px 0 24px;padding:24px 26px;border:1px solid var(--ln);border-radius:20px;background:linear-gradient(115deg,rgba(224,162,59,.13),rgba(255,255,255,.035) 52%,rgba(255,255,255,.015));box-shadow:inset 0 1px rgba(255,255,255,.11),0 16px 42px rgba(0,0,0,.12)}
body.adm .dash-head h2{font-size:clamp(22px,3vw,34px);margin:4px 0}
body.adm .dash-head p{margin:3px 0 0}
body.adm .dash-actions{display:flex;gap:8px;flex-wrap:wrap}
body.adm .dash-filter{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 12px}
body.adm .dash-filter select{width:auto;min-width:145px;padding:8px 12px}
body.adm .dash-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
body.adm .dash-kpi{padding:17px 18px;min-width:0;position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:inset 0 1px rgba(255,255,255,.1),0 10px 28px rgba(0,0,0,.12);transition:transform .22s,border-color .22s}
body.adm .dash-kpi:hover{transform:translateY(-3px);border-color:rgba(224,162,59,.48)}
body.adm .dash-kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;gap:8px}
body.adm .dash-kpi-top i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ac);background:rgba(224,162,59,.13);font-size:16px}
body.adm .dash-kpi>b{display:block;font:600 clamp(20px,2.3vw,29px)/1.2 var(--fb);letter-spacing:-.04em;margin:12px 0 5px;overflow-wrap:anywhere}
body.adm .dash-kpi small{color:var(--mut);font-size:10px}
body.adm .dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.85fr);gap:14px;margin-bottom:14px}
body.adm .dash-grid.lower{grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr)}
body.adm .dash-panel{padding:20px;min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.022));box-shadow:inset 0 1px rgba(255,255,255,.1),0 12px 34px rgba(0,0,0,.12)}
body.adm .dash-panel h3{font-size:18px;margin:2px 0 12px}
body.adm .dash-chart{height:190px;display:flex;align-items:end;gap:clamp(8px,2vw,20px);padding:20px 4px 25px;border-bottom:1px solid var(--ln)}

body.adm .dash-bar-wrap>b{font-size:10px;color:var(--mut);font-weight:500;white-space:nowrap}
body.adm .dash-bar{width:min(100%,38px);min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#f4c66e,var(--ac) 60%,rgba(224,162,59,.48));box-shadow:0 0 22px rgba(224,162,59,.13);animation:dashRise .6s ease both;transform-origin:bottom}
body.adm .dash-bar-wrap small{font-size:10px;color:var(--mut)}
@keyframes dashRise{from{transform:scaleY(.12);opacity:.3}to{transform:scaleY(1);opacity:1}}
body.adm .dash-foot{padding-top:12px}
body.adm .pulse-list{display:grid;margin-top:8px}
body.adm .pulse-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px;border:0;border-top:1px solid var(--ln);border-radius:0;background:transparent;text-align:left;letter-spacing:0;font-weight:500}
body.adm .pulse-row b{margin-left:auto;font-size:17px}
body.adm .pulse-row i{font-style:normal;color:var(--mut);font-size:20px}
body.adm .pulse-row:hover{color:var(--ac)}
body.adm .dash-recent,body.adm .dash-products{display:grid;margin-top:8px}
body.adm .dash-order{display:flex;align-items:center;gap:11px;width:100%;padding:11px 2px;border:0;border-top:1px solid var(--ln);border-radius:0;background:transparent;text-align:left;letter-spacing:0}
body.adm .dash-order:hover{background:rgba(255,255,255,.035)}
body.adm .dash-order-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(224,162,59,.12);color:var(--ac)}
body.adm .dash-order-info{display:grid;gap:3px;min-width:0}
body.adm .dash-order-info b{font-size:12px}
body.adm .dash-order-info small{font-size:10px;color:var(--mut)}
body.adm .dash-order-total{margin-left:auto;display:grid;justify-items:end;gap:5px;white-space:nowrap}
body.adm .dash-order-total>b{font-size:12px}
body.adm .dash-order-total .sb{font-size:9px;padding:2px 7px}
body.adm .dash-product{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}
body.adm .dash-rank{font:400 20px var(--fn);color:var(--ac)}
body.adm .dash-product-info{display:grid;gap:4px;flex:1;min-width:0}
body.adm .dash-product-info>b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.adm .dash-product-info small{font-size:10px;color:var(--mut)}

:root[data-t=light] body.adm .dash-head,:root[data-t=light] body.adm .dash-kpi,:root[data-t=light] body.adm .dash-panel{background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.56));box-shadow:inset 0 1px rgba(255,255,255,.9),0 10px 28px rgba(80,55,15,.07)}

/* IJAZ monochrome glass identity — global storefront + admin */

:root[data-t=light]{--bg:#f2f2f2;--bg2:#fff;--fg:#171717;--mut:#666;--gl:rgba(255,255,255,.68);--ln:rgba(0,0,0,.13);--ac:#171717;--act:#171717;color-scheme:light}
body{background:radial-gradient(900px 520px at 78% -12%,rgba(255,255,255,.10),transparent 58%),radial-gradient(700px 420px at 0% 35%,rgba(255,255,255,.035),transparent 60%),var(--bg);transition:background .45s ease,color .35s ease}
:root[data-t=light] body{background:radial-gradient(900px 520px at 80% -12%,rgba(0,0,0,.07),transparent 58%),linear-gradient(145deg,#fafafa,#e9e9e9)}
header{background:rgba(8,8,8,.68);border-bottom-color:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(26px) saturate(1.35);backdrop-filter:blur(26px) saturate(1.35);box-shadow:0 8px 34px rgba(0,0,0,.12)}

.glass,.pc,.sidebar,.pro-panel,.pro-metric,.pro-quick,.stat,.cd,.rc,.note,.agrp,.dt,.tbl,.attn-c{background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.025) 58%,rgba(255,255,255,.065));border:1px solid rgba(255,255,255,.17);-webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 14px 42px rgba(0,0,0,.18)}
:root[data-t=light] .glass,:root[data-t=light] .pc,:root[data-t=light] .sidebar,:root[data-t=light] .pro-panel,:root[data-t=light] .pro-metric,:root[data-t=light] .pro-quick,:root[data-t=light] .stat,:root[data-t=light] .cd,:root[data-t=light] .rc,:root[data-t=light] .note,:root[data-t=light] .agrp,:root[data-t=light] .dt,:root[data-t=light] .tbl,:root[data-t=light] .attn-c{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.52));border-color:rgba(0,0,0,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 38px rgba(0,0,0,.07)}

<script id="ijaz-button-feedback">
(function(){
 if(window.__ijButtonFeedbackReady)return;window.__ijButtonFeedbackReady=true;
 let active=null,clear=null;
 document.addEventListener("pointerdown",function(e){
  const el=e.target.closest("button, .btn, a.button, [role='button']");
  if(!el||el.disabled)return;
  if(active)active.classList.remove("ij-pressed");
  active=el;el.classList.add("ij-pressed");
  clearTimeout(clear);clear=setTimeout(()=>{el.classList.remove("ij-pressed");if(active===el)active=null},650);
 },true);
 function release(){if(active){active.classList.remove("ij-pressed");active=null}clearTimeout(clear)}
 document.addEventListener("pointerup",release,true);
 document.addEventListener("pointercancel",release,true);
 document.addEventListener("click",function(e){
  const el=e.target.closest("button, .btn, a.button, [role='button']");
  if(!el)return;
  el.classList.add("ij-clicked");
  setTimeout(()=>el.classList.remove("ij-clicked"),220);
 },true);
})();
</script>

/* Scroll reveal observer is reattached after every storefront/admin render */
let ijScrollObserver=null,ijLastScrollY=0,ijScrollDirection="down";
window.addEventListener("scroll",()=>{const y=window.scrollY||0;ijScrollDirection=y<ijLastScrollY?"up":"down";ijLastScrollY=y},{passive:true});
function ijObserveMotion(){
 const root=document.getElementById("app");if(!root)return;
 if(ijScrollObserver)ijScrollObserver.disconnect();
 const targets=root.querySelectorAll(":scope > main > .hero,:scope > main > .sec,:scope > main > .grid,:scope > main > .glass,:scope > main > .pc,:scope > main > .pro-panel,:scope > main > .pro-metric,:scope > main > .pro-quick,:scope > main > .dash-head,:scope > main > .dash-kpi,:scope > main > .stat,:scope > main > .cd,:scope > main > .rc,:scope > .hero,:scope .sec,:scope .pro-panel,:scope .pro-metric,:scope .pro-quick,:scope .dash-kpi,:scope .stat,:scope .pc,:scope .orow,:scope .cd,:scope .rc");
 const variants=["ij-motion-rise","ij-motion-left","ij-motion-zoom","ij-motion-soft","ij-motion-right"];
 targets.forEach((el,i)=>{
  el.classList.add("ij-reveal");
  const variant=el.matches(".hero,.dash-head")?"ij-motion-soft":el.matches(".pc,.pro-metric,.dash-kpi,.stat")?"ij-motion-zoom":el.matches(".sec,.pro-panel")?"ij-motion-left":variants[i%variants.length];
  el.classList.add(variant);el.style.transitionDelay=(i%4)*65+"ms";
 });
 if(!("IntersectionObserver" in window)){targets.forEach(x=>x.classList.add("ij-visible"));return}
 ijScrollObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
  const el=entry.target;
  if(entry.isIntersecting){el.classList.remove("ij-leaving-up","ij-leaving-down");el.classList.add("ij-visible")}
  else if(el.classList.contains("ij-visible")){el.classList.remove("ij-visible");el.classList.add(ijScrollDirection==="up"?"ij-leaving-up":"ij-leaving-down")}
 }),{root:null,rootMargin:"0px 0px -7% 0px",threshold:.08});
 targets.forEach(el=>ijScrollObserver.observe(el));
}
function ijAnimateDashboard(root){
 if(!root||!root.querySelector(".pro-dash"))return;
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 root.querySelectorAll("[data-count]").forEach(el=>{
  const target=Math.max(0,Number(el.dataset.count)||0),prefix=el.dataset.countPrefix||"";
  if(reduce){el.textContent=prefix+Math.round(target).toLocaleString("en-IN");return}
  const start=performance.now(),duration=1050;
  const tick=now=>{const p=Math.min(1,(now-start)/duration),v=Math.round(target*(1-Math.pow(1-p,4)));el.textContent=prefix+v.toLocaleString("en-IN");if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
 });
 root.querySelectorAll("[data-progress]").forEach(el=>{
  const target=Math.max(0,Math.min(100,Number(el.dataset.progress)||0)),vertical=el.closest(".pro-chart-track");
  const prop=vertical?"height":"width";el.style[prop]="0%";
  if(reduce){el.style[prop]=target+"%";return}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition=prop+" 1.15s cubic-bezier(.2,.75,.2,1)";el.style[prop]=target+"%"}));
 });
}
